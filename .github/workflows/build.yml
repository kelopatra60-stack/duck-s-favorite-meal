name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: فك ضغط المشروع
        run: unzip -q project.zip -d proj
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: بناء التطبيق
        run: cd proj/duck-ants-android && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: duck-ants-apk
          path: proj/duck-ants-android/app/build/outputs/apk/debug/app-debug.apk
